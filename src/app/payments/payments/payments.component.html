<!-- Card Header -->
<div class="card shadow-sm payments-card">
<div class="card-header app-theme-bgcolor text-white d-flex justify-content-between align-items-center">
  <h5 class="mb-0">Payments</h5>
  <button class="btn btn-light btn-sm" (click)="openModal()">+ Record Payment</button>
  <!-- <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#paymentModal">+ Record Payment</button> -->
</div>

<!-- Existing table ... -->

<div class="card-body">
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Resident</th>
            <th>Apartment</th>
            <th>Month</th>
            <th>Amount (₹)</th>
            <th>Date</th>
            <th>Mode</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let payment of payments; index as i">
            <td>{{ i + 1 }}</td>
            <td>{{ payment.name }}</td>
            <td>{{ payment.apartmentNumber }}</td>
            <td>{{ payment.month }}</td>
            <td>{{ payment.amount }}</td>
            <td>{{ payment.date }}</td>
            <td>{{ payment.mode }}</td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': payment.status === 'Success',
                      'bg-warning text-dark': payment.status === 'Pending',
                      'bg-danger': payment.status === 'Failed'
                    }">
                {{ payment.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="payments.length === 0">
            <td colspan="8" class="text-center">No payment records found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>
 
  <!-- Record Payment Modal -->
<div #paymentModal class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form (ngSubmit)="addPayment()" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="paymentModalLabel">Record New Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-2">
          <label>Resident Name</label>
          <select [(ngModel)]="newPayment.name" name="name" class="form-select" required>
            <option *ngFor="let member of members" [value]="member.name">{{ member.name }} ({{ member.apartmentNumber }})</option>
          </select>
        </div>
        <div class="mb-2">
          <label>Month</label>
          <input type="month" [(ngModel)]="newPayment.month" name="month" class="form-control" required />
        </div>
        <div class="mb-2">
          <label>Amount</label>
          <input type="number" [(ngModel)]="newPayment.amount" name="amount" class="form-control" required />
        </div>
        <div class="form-check">
          <input type="checkbox" [(ngModel)]="newPayment.fine" name="fine" class="form-check-input" id="fineCheck">
          <label class="form-check-label" for="fineCheck">Fine Applicable (₹100)</label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Save Payment</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </form>
  </div>
</div>
