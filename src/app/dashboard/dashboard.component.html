<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar app-theme-bgcolor bg-blue text-white d-flex flex-column p-3">
    <div class="text-center mb-4">
      <!-- <img src="assets/logo.png" alt="Logo" class="sidebar-logo mb-2" /> -->
      <h4>eSociety</h4>
    </div>

    <ul class="nav flex-column nav-pills">
      <li class="nav-item mb-2">
        <a class="nav-link text-white" 
        *ngFor="let link of navigationLinks" 
        [routerLink]="link.path" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ link.label }}</a>
      </li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <div class="flex-grow-1 p-4 main-content bg-light">
    <router-outlet></router-outlet>
  </div>
</div>
