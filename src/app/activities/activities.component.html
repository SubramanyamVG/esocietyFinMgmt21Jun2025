<div class="card shadow-sm activities-card">
<!-- Header -->
<div class="card-header app-theme-bgcolor text-white d-flex justify-content-between align-items-center">
  <h5 class="mb-0">Society Activities</h5>
  <button class="btn btn-light btn-sm" (click)="openModal()">+ Add Activity</button>
</div>

<!-- Activities Grid -->
<div class="card-body">
  <div class="row g-3">
  <div class="col-md-4" *ngFor="let activity of activities; index as i">
    <div class="activity-box p-3 h-100 border rounded shadow-sm bg-white">
      <h6 class="fw-bold text-primary">{{ activity.title }}</h6>
      <p class="text-muted small mb-1">
        <i class="bi bi-calendar-event me-1"></i> {{ activity.date }}
      </p>
      <p class="mb-2">{{ activity.description }}</p>
      <span class="badge bg-info text-dark me-2">{{ activity.type }}</span>

      <div class="mt-3 d-flex justify-content-end gap-2">
        <button class="btn btn-sm btn-outline-primary" (click)="openModal(activity, i)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteActivity(i)">Delete</button>
      </div>
    </div>
  </div>
  <div *ngIf="activities.length === 0" class="text-center text-muted">
    No activities available.
  </div>
</div>
</div>
</div>

<!-- Modal -->
<div class="modal fade" tabindex="-1"
     [ngClass]="{ 'show d-block': showModal }"
     [ngStyle]="{ 'background-color': 'rgba(0,0,0,0.5)' }">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="activityForm" (ngSubmit)="saveActivity()">
        <div class="modal-header">
          <h5 class="modal-title">Add Activity</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label>Title</label>
            <input formControlName="title" class="form-control" type="text" />
          </div>
          <div class="mb-3">
            <label>Date</label>
            <input formControlName="date" class="form-control" type="date" />
          </div>
          <div class="mb-3">
            <label>Description</label>
            <textarea formControlName="description" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label>Type</label>
            <select formControlName="type" class="form-select">
              <option value="Notice">Notice</option>
              <option value="Event">Event</option>
              <option value="Meeting">Meeting</option>
              <option value="Announcement">Announcement</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="activityForm.invalid">Save</button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
