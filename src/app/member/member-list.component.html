<!-- members Table -->
<div class="card shadow-sm mb-4">
  <div class="card-header app-theme-bgcolor text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Manage Members</h5>
    <button class="btn btn-light btn-sm" (click)="openModal()">+ Add member</button>
  </div>

  <div class="card-body p-3">
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Apartment Number</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of members; index as i">
            <td>{{ i + 1 }}</td>
            <td>{{ member.name }}</td>
            <td>{{ member.apartmentNumber }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="openModal(member)">Edit</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteMember(member.memberId)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="members?.length === 0">
            <td colspan="6" class="text-center">No members found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- member Modal -->
<div class="modal fade" tabindex="-1" [ngClass]="{ 'show d-block': showModal }" [ngStyle]="{ 'background-color': 'rgba(0,0,0,0.5)' }">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="memberForm" (ngSubmit)="saveMember()">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEdit ? 'Edit member' : 'Add member' }}</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label>Name</label>
            <input formControlName="name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Apartment Number</label>
            <input formControlName="apartmentNumber" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input formControlName="email" type="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Phone</label>
            <input formControlName="phone" class="form-control" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="memberForm.invalid">Save</button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
